# Validómetro: one Worker (Cloudflare free plan) serves the PWA (static assets in dist/) and
# the API under /api/*, with D1. Setup, done once (see README.md):
#   pnpm exec wrangler login
#   CLOUDFLARE_ACCOUNT_ID=<account> pnpm exec wrangler d1 create validometro --jurisdiction eu
#   (copy the database_id below and set account_id)
#   pnpm db:migrate:remote
#   pnpm deploy
name = "validometro"
main = "src/worker/index.ts"
# TODO(Phase 0): set the Cloudflare account that owns Validómetro (the login on this
# machine sees several).
# account_id = ""
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only the API runs code; every other path is a static file.
run_worker_first = ["/api/*", "/api"]

[[d1_databases]]
binding = "DB"
database_name = "validometro"
# TODO(Phase 0): replace with the id printed by `wrangler d1 create`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true
