# The app on Cloudflare: https://app.validometro.workers.dev
# Validómetro: one Worker (Cloudflare free plan) serves the PWA (static assets in dist/) and
# the API under /api/*, with D1. Setup, done once (see README.md):
#   pnpm exec wrangler login
#   CLOUDFLARE_ACCOUNT_ID=<account> pnpm exec wrangler d1 create validometro --jurisdiction eu
#   (copy the database_id below and set account_id)
#   pnpm db:migrate:remote
#   pnpm deploy
name = "app"
main = "src/worker/index.ts"
# Validómetro's own Cloudflare account (validometro@outlook.com; pmmrb1967@gmail.com is an
# Administrator member): the login on this machine sees several.
account_id = "3c37a84e831f214acafff4873b338bba"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only the API runs code; every other path is a static file.
run_worker_first = ["/api/*", "/api", "/partilhar"]

[[d1_databases]]
binding = "DB"
database_name = "validometro"
database_id = "0916b1e9-1569-42f6-b23f-73f22422be6e" # created with --jurisdiction eu
migrations_dir = "migrations"

# Workers AI: the default reader (free daily Neurons). See src/ai/providers/workers-ai.ts.
[ai]
binding = "AI"
remote = true

# Every hour: the free-plan watch (monitor.ts); the run that is 09:00 in Lisbon also sends
# the daily alert (alerts.ts), whether it is summer or winter time.
[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true
